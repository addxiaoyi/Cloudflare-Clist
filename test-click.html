<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>按钮点击验证测试</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px 20px; background: #f5f5f5; }
    .container { max-width: 800px; margin: 0 auto; }
    .test-section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 1px solid #ccc; background: white; cursor: pointer; transition: all 0.15s; }
    .icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; background: white; border: 1px solid #ccc; }
    svg { pointer-events: none; }
    .result { padding: 12px 16px; margin: 8px 0; border-radius: 6px; font-family: monospace; }
    .pass { background: #d4edda; color: #155724; }
    .fail { background: #f8d7da; color: #721c24; }
    .status { font-size: 14px; color: #6c757d; }
  </style>
</head>
<body>
  <div class="container">
    <h1>按钮点击冒烑测试</h1>
    
    <div class="test-section">
      <h3>测试区域</h3>
      <p class="status">点击下方按钮测试点击事件是否正常传递：</p>
      <div style="margin: 16px 0;">
        <button id="test-btn" class="btn">
          测试按钮 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path></svg>
        </button>
      </div>
      <p class="status">点击次数：<span id="count">0</span></p>
    </div>
    
    <div class="test-section">
      <h3>测试结果</h3>
      <div id="results"></div>
    </div>
  </div>

  <script>
    let count = 0;
    const btn = document.getElementById('test-btn');
    const countEl = document.getElementById('count');
    const results = document.getElementById('results');
    
    function logResult(text, passed) {
      const div = document.createElement('div');
      div.className = `result ${passed ? 'pass' : 'fail'}`;
      div.textContent = (passed ? '✓ ' : '✗ ') + text;
      results.appendChild(div);
    }
    
    // 初始测试
    logResult('页面加载成功', true);
    
    const svg = btn.querySelector('svg');
    logResult('SVG 指令 pointer-events: none', svg.getAttribute('pointer-events') === 'none', `实际值: ${svg.getAttribute('pointer-events')}`);
    
    btn.addEventListener('click', function(e) {
      count++;
      countEl.textContent = count;
      console.log('按钮点击成功！', count);
      
      if (count === 1) {
        logResult(`按钮点击事件正常传递 (${count} 次)`, true);
      }
    });
    
    // 记录事件流
    btn.addEventListener('mousedown', () => console.log('mousedown'));
    btn.addEventListener('mouseup', () => console.log('mouseup'));
    document.addEventListener('click', (e) => {
      if (!btn.contains(e.target)) console.log('外部点击:', e.target);
    });
  </script>
</body>
</html>
