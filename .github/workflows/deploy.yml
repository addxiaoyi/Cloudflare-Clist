name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Wrangler config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          WORKER_MAIN: ${{ vars.WORKER_MAIN }}
          COMPATIBILITY_DATE: ${{ vars.COMPATIBILITY_DATE }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_BINDING: ${{ vars.D1_BINDING }}
          D1_MIGRATIONS_DIR: ${{ vars.D1_MIGRATIONS_DIR }}
          OBSERVABILITY_ENABLED: ${{ vars.OBSERVABILITY_ENABLED }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_ANNOUNCEMENT: ${{ vars.SITE_ANNOUNCEMENT }}
          CHUNK_SIZE_MB: ${{ vars.CHUNK_SIZE_MB }}
          WEBDAV_ENABLED: ${{ vars.WEBDAV_ENABLED }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
        run: |
          WORKER_NAME="${WORKER_NAME:-clist}"
          WORKER_MAIN="${WORKER_MAIN:-./workers/app.ts}"
          COMPATIBILITY_DATE="${COMPATIBILITY_DATE:-2025-04-04}"
          D1_DATABASE_NAME="${D1_DATABASE_NAME:-clist}"
          D1_BINDING="${D1_BINDING:-DB}"
          D1_MIGRATIONS_DIR="${D1_MIGRATIONS_DIR:-./migrations}"
          OBSERVABILITY_ENABLED="${OBSERVABILITY_ENABLED:-true}"

          if [ -z "$D1_DATABASE_ID" ]; then
            if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
              echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID for D1 lookup." >&2
              exit 1
            fi
            D1_DATABASE_ID="$(npx wrangler d1 list --json | node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync(0,'utf8'));const name=process.env.D1_DATABASE_NAME;const hit=data.find(d=>d.name===name);if(!hit){process.exit(2)};process.stdout.write(hit.uuid);")"
            if [ $? -ne 0 ] || [ -z "$D1_DATABASE_ID" ]; then
              echo "Failed to find D1 database ID for name: $D1_DATABASE_NAME" >&2
              exit 1
            fi
          fi
          # 非敏感变量写入 config，随 build 产物走；敏感凭据走 wrangler secret（见下步）
          node <<'EOF'
const fs = require("fs");
const env = process.env;
const cfg = {
  $schema: "node_modules/wrangler/config-schema.json",
  name: env.WORKER_NAME || "clist",
  main: env.WORKER_MAIN || "./workers/app.ts",
  compatibility_date: env.COMPATIBILITY_DATE || "2025-04-04",
  keep_vars: true,
  observability: { enabled: (env.OBSERVABILITY_ENABLED || "true") === "true" },
  vars: {
    SITE_TITLE: env.SITE_TITLE || "CList",
    SITE_ANNOUNCEMENT: env.SITE_ANNOUNCEMENT || "",
    CHUNK_SIZE_MB: env.CHUNK_SIZE_MB || "50",
    WEBDAV_ENABLED: env.WEBDAV_ENABLED || "false",
    GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID || "",
    GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET || "",
    GOOGLE_REDIRECT_URI: env.GOOGLE_REDIRECT_URI || "",
  },
  d1_databases: [
    {
      binding: env.D1_BINDING || "DB",
      database_name: env.D1_DATABASE_NAME || "clist",
      database_id: env.D1_DATABASE_ID,
      migrations_dir: env.D1_MIGRATIONS_DIR || "./migrations",
    },
  ],
};
// 配置了 R2 桶名则自动挂载，未配置则不带 r2_buckets 绑定
if (env.R2_BUCKET_NAME) {
  cfg.r2_buckets = [{ binding: "R2", bucket_name: env.R2_BUCKET_NAME }];
}
fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2) + "\n");
EOF

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply ${{ vars.D1_DATABASE_NAME }} --remote --config wrangler.jsonc

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config build/server/wrangler.json

      - name: Configure admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          # 必填的管理员凭据缺失时直接失败，避免“部署成功但登录不了”
          if [ -z "$ADMIN_USERNAME" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "Missing required secrets: ADMIN_USERNAME / ADMIN_PASSWORD" >&2
            exit 1
          fi
          # 经 stdin 写入 secret，避免密码含特殊字符时被 shell 展开破坏
          printf '%s' "$ADMIN_USERNAME" | npx wrangler secret put ADMIN_USERNAME --config build/server/wrangler.json
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config build/server/wrangler.json
          if [ -n "$WEBDAV_USERNAME" ] && [ -n "$WEBDAV_PASSWORD" ]; then
            printf '%s' "$WEBDAV_USERNAME" | npx wrangler secret put WEBDAV_USERNAME --config build/server/wrangler.json
            printf '%s' "$WEBDAV_PASSWORD" | npx wrangler secret put WEBDAV_PASSWORD --config build/server/wrangler.json
          fi
