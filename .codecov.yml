# Codecov Configuration
# https://docs.codecov.com/docs/codecovyml-reference

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 40%
        threshold: 2%
        branches:
          - main
          - master
        only_pulls: false
  
    patch:
      default:
        target: 60%
        threshold: 1%
        branches:
          - main
          - master
        only_pulls: true

# File patterns to include/exclude
ignore:
  - "app/lib/git/**"
  - "app/routes/**"
  - "workers/**"
  - "dist/**"
  - "coverage/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: true
